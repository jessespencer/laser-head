<!DOCTYPE html>

  <head>

    <title>LASER HEAD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap"

    />
    <style>

        background: #05060f;
